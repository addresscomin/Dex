name: MyBlocker Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "Blocker/**"
      - "README.md"
      - ".github/workflows/android-build.yml"
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p Blocker assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -s Blocker/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyBlocker-debug-apk
          path: Blocker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: myblocker-build-${{ github.run_number }}
          name: MyBlocker build ${{ github.run_number }}
          prerelease: true
          files: Blocker/app/build/outputs/apk/debug/app-debug.apk
